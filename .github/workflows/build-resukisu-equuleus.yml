name: Build ReSukiSU for equuleus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout pinned equuleus baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: b6ac784a9c3ec331c0cc2de9c5b5e99a9c4c7ddb
          submodules: recursive
          fetch-depth: 1

      - name: Checkout versioned build adapter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: workflow-ref
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list
          sudo mkdir -p /etc/apt/sources.list.d.disabled
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name '*.list' -o -name '*.sources' \) -exec mv {} /etc/apt/sources.list.d.disabled/ \;
          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/equuleus-snapshot.list >/dev/null
          deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20261013T000000Z/ noble main universe
          deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20261013T000000Z/ noble-updates main universe
          deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20261013T000000Z/ noble-security main universe
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc=1.07.1-3ubuntu4 \
            bison=2:3.8.2+dfsg-1ubuntu0.24.04.1 \
            binutils=2.42-4ubuntu2.10 \
            ccache=4.9.1-1 \
            flex=2.6.4-8.2build1 \
            libelf-dev=0.190-1.1ubuntu0.1 \
            libssl-dev=3.0.13-0ubuntu3.16 \
            make=4.3-4.1build2 \
            patch=2.7.6-7build3 \
            unzip=6.0-28ubuntu4.1 \
            zip=3.0-13ubuntu0.2 \
            clang-18=1:18.1.3-1ubuntu1 \
            lld-18=1:18.1.3-1ubuntu1 \
            llvm-18=1:18.1.3-1ubuntu1 \
            gcc-aarch64-linux-gnu=4:13.2.0-7ubuntu1 \
            binutils-aarch64-linux-gnu=2.42-4ubuntu2.10 \
            gcc-arm-linux-gnueabihf=4:13.2.0-7ubuntu1 \
            binutils-arm-linux-gnueabihf=2.42-4ubuntu2.10
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          clang --version
          llvm-ar --version
          ld.lld --version
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabihf-gcc --version
      - name: Select ReSukiSU UAPI 5 source
        shell: bash
        run: |
          set -euo pipefail
          git -C KernelSU fetch --no-tags --depth=1 origin \
            8770c7e324a22895703c4916b8a16520e0b81c79
          git -C KernelSU checkout --detach \
            8770c7e324a22895703c4916b8a16520e0b81c79
      - name: Verify pinned sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C workflow-ref rev-parse HEAD)" = \
            "${GITHUB_SHA}"
          test -f workflow-ref/ci/build-equuleus-resukisu.sh
          reference_baseline_repo='https://github.com/GuLingguang/xiaomi-sdm845-kernel-pro'
          test "${GITHUB_REPOSITORY:-}" != "${reference_baseline_repo#https://github.com/}"
          test "$(git rev-parse HEAD)" = \
            b6ac784a9c3ec331c0cc2de9c5b5e99a9c4c7ddb
          test "$(git -C KernelSU rev-parse HEAD)" = \
            8770c7e324a22895703c4916b8a16520e0b81c79
          test "$(git -C AnyKernel3 rev-parse HEAD)" = \
            9eed8aea17dd92b97cf71368b74ac1174129e733
          uapi=$(sed -n 's/.*KERNEL_SU_UAPI_VERSION = \([0-9][0-9]*\).*/\1/p' KernelSU/uapi/supercall.h)
          test "$uapi" = 5
          test -f KernelSU/kernel/Kconfig
          grep -Fq 'ifneq ($(LLVM),)' Makefile
          grep -Fq 'HOSTCC       = clang' Makefile
          grep -Fq 'HOSTCXX      = clang++' Makefile
          grep -Fq '$(HOSTCC)' scripts/Makefile.host
          grep -Fq '$(HOSTCXX)' scripts/Makefile.host
          test -f AnyKernel3/anykernel.sh

      - name: Prepare approved KSU hook config
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/equuleus-ksu.config" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_SUSFS is not set
          EOF
          cat "$RUNNER_TEMP/equuleus-ksu.config"

      - name: Build kernel and package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee build.log) 2>&1
          export KSU_CONFIG="$RUNNER_TEMP/equuleus-ksu.config"
          export KBUILD_JOBS=4
          export LLVM=1
          export HOSTCC=clang
          export HOSTCXX=clang++
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          bash workflow-ref/ci/build-equuleus-resukisu.sh
      - name: Verify and record build
        shell: bash
        run: |
          set -euo pipefail
          export LLVM=1
          export HOSTCC=clang
          export HOSTCXX=clang++
          export PATH="/usr/lib/llvm-18/bin:$PATH"

          uapi=$(sed -n 's/.*KERNEL_SU_UAPI_VERSION = \([0-9][0-9]*\).*/\1/p' KernelSU/uapi/supercall.h)
          test "$uapi" = 5
          image=out/arch/arm64/boot/Image.gz-dtb
          raw_image=out/arch/arm64/boot/Image
          zipfile=AnyKernel3/ak3-equuleus.zip
          zip_image="$RUNNER_TEMP/zip-Image.gz-dtb"
          test -s "$image"
          test -s "$raw_image"
          test -s "$zipfile"
          unzip -Z1 "$zipfile" | grep -Fx 'Image.gz-dtb' >/dev/null
          unzip -p "$zipfile" Image.gz-dtb > "$zip_image"
          cmp -s "$image" "$zip_image"
          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' out/.config
          if grep -Eq '^CONFIG_KSU_SUSFS(_[A-Za-z0-9_]+)?=y$' out/.config; then
            echo 'The SUSFS family must be disabled for the approved Manual Hook build.' >&2
            exit 1
          fi

          test -n "${BUILD_ADAPTER_SHA256:-}"
          test -n "${BASELINE_BUILD_SCRIPT_SHA256:-}"
          test -n "${BUILD_SOURCE_COMPAT_PATCH:-}"
          test "${KBUILD_JOBS:-}" = 4
          {
            echo "build_adapter=workflow-ref/ci/build-equuleus-resukisu.sh"
            echo "build_adapter_sha256=$BUILD_ADAPTER_SHA256"
            echo "baseline_build_script_sha256=$BASELINE_BUILD_SCRIPT_SHA256"
            echo "build_source_compat_patch=$BUILD_SOURCE_COMPAT_PATCH"
            echo "kbuild_jobs=$KBUILD_JOBS"
            echo "apt_snapshot_url=https://snapshot.ubuntu.com/ubuntu/20261013T000000Z/"
            echo "apt_suites=noble,noble-updates,noble-security"
            echo "apt_components=main,universe"
            for pkg in \
              bc bison binutils ccache flex libelf-dev libssl-dev make patch unzip zip \
              clang-18 lld-18 llvm-18 \
              gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
              gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf; do
              version="$(dpkg-query -W -f='${Version}' "$pkg")"
              echo "apt_package_${pkg//-/_}=$version"
            done
            echo "host_selection=LLVM=1 HOSTCC=clang HOSTCXX=clang++"
            echo "hostcc_path=$(command -v "$HOSTCC")"
            echo "hostcxx_path=$(command -v "$HOSTCXX")"
            echo "hostcc_version=$(clang --version | sed -n '1p')"
            echo "hostcxx_version=$(clang++ --version | sed -n '1p')"
            echo "llvm_ar_path=$(command -v llvm-ar)"
            echo "llvm_ar_version=$(llvm-ar --version | sed -n '1p')"
            echo "workflow_repository=${GITHUB_REPOSITORY}"
            echo "reference_baseline_repo=https://github.com/GuLingguang/xiaomi-sdm845-kernel-pro"
            echo "baseline_commit=$(git rev-parse HEAD)"
            echo "resukisu_repo=https://github.com/ReSukiSU/ReSukiSU"
            echo "resukisu_commit=$(git -C KernelSU rev-parse HEAD)"
            echo "resukisu_uapi=$uapi"
            echo "anykernel3_commit=$(git -C AnyKernel3 rev-parse HEAD)"
            echo "kernel_version=$(make -s O=out kernelversion)"
            echo "image=$image"
            sha256sum "$image" "$zipfile"
          } | tee build-metadata.txt

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: equuleus-resukisu-uapi5-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            AnyKernel3/ak3-equuleus.zip
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
            build.log
            build-metadata.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: equuleus-resukisu-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build.log
            build-metadata.txt
